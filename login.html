<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal Login | Custom Event Lighting & Draping Design Company</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body {
            background: var(--primary-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 15px 30px;
        }
    </style>
</head>
<body data-theme="light">
    <div class="position-absolute top-0 end-0 p-3 p-md-4 d-flex gap-2 z-3">
        <button id="rtl-toggle" class="btn btn-outline-fest nav-icon-btn fw-bold" style="font-size: 0.8rem;">RTL</button>
        <button id="theme-toggle" class="btn btn-outline-fest nav-icon-btn"><i class="bi bi-moon-stars-fill"></i></button>
    </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="service-card p-3 p-md-5 shadow-lg border-0" style="background: var(--card-bg); border: 1px solid var(--border-color) !important;">
                    <div class="text-center mb-5">
                        <a class="navbar-brand d-flex align-items-center justify-content-center gap-2 mb-4" href="index.html" style="text-decoration: none;">
                            <svg width="48" height="48" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="25" cy="25" r="23" fill="#0B0D14" stroke="#D97706" stroke-width="2"/>
                                <path d="M10 14C18 22 32 22 40 14" stroke="url(#auth_glow)" stroke-width="3" stroke-linecap="round"/>
                                <path d="M25 8V18" stroke="#F59E0B" stroke-width="2"/>
                                <circle cx="25" cy="27" r="9" fill="url(#auth_bulb)"/>
                                <path d="M21 27L25 21L29 27" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="25" cy="27" r="3" fill="#FFFFFF"/>
                                <path d="M12 38C18 34 32 34 38 38" stroke="url(#auth_glow)" stroke-width="2" stroke-linecap="round"/>
                                <defs>
                                    <linearGradient id="auth_glow" x1="10" y1="14" x2="40" y2="38" gradientUnits="userSpaceOnUse">
                                        <stop stop-color="#D97706"/>
                                        <stop offset="1" stop-color="#F59E0B"/>
                                    </linearGradient>
                                    <radialGradient id="auth_bulb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(25 27) rotate(90) scale(10)">
                                        <stop stop-color="#F59E0B"/>
                                        <stop offset="1" stop-color="#D97706"/>
                                    </radialGradient>
                                </defs>
                            </svg>
                            <span class="fs-2 fw-bolder mb-0" style="color: var(--sunflower-yellow); letter-spacing: -0.5px; font-family: 'Cormorant Garamond', Georgia, serif;">Lumina<span style="color: var(--sky-orange);">Drape</span></span>
                        </a>
                        <h2 class="fw-bold" style="font-family: var(--font-heading);">Client Portal Login</h2>
                        <p class="text-muted">Manage your event lighting layout & floorplans.</p>
                    </div>
                    <form onsubmit="event.preventDefault(); alert('Login successful! Redirecting to event dashboard...'); location.href='index.html';">
                        <div class="mb-4 text-start">
                            <label class="form-label fw-bold small text-muted">Email Address</label>
                            <input type="email" class="form-control rounded-pill p-3 border-warning" placeholder="planner@example.com" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label fw-bold small text-muted">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control rounded-start-pill p-3 border-warning border-end-0" placeholder="********" id="loginPassword" required>
                                <span class="input-group-text bg-transparent border-warning border-start-0 rounded-end-pill pe-4" style="cursor: pointer;" onclick="const input = document.getElementById('loginPassword'); const icon = this.querySelector('i'); if(input.type === 'password') { input.type = 'text'; icon.classList.replace('bi-eye', 'bi-eye-slash'); } else { input.type = 'password'; icon.classList.replace('bi-eye-slash', 'bi-eye'); }">
                                    <i class="bi bi-eye text-muted"></i>
                                </span>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4 flex-nowrap">
                            <div class="form-check mb-0">
                                <input class="form-check-input border-warning" type="checkbox" id="rememberMe">
                                <label class="form-check-label text-muted small text-nowrap" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="small fw-bold text-nowrap ms-2" style="color: var(--sunflower-yellow);">Forgot Password?</a>
                        </div>
                        <button type="submit" class="btn btn-project btn-primary-fest w-100 py-3 mb-4">Login to Portal</button>
                        
                        <div class="position-relative mb-4 text-center">
                            <hr class="text-muted opacity-25">
                            <span class="position-absolute top-50 start-50 translate-middle px-2 text-muted small text-nowrap" style="background: var(--card-bg); font-size: 0.75rem;">Or continue with</span>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-fest w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-google"></i> Google
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-fest w-100 py-2 d-flex align-items-center justify-content-center gap-2">
                                    <i class="bi bi-apple"></i> Apple
                                </button>
                            </div>
                        </div>

                        <div class="text-center">
                            <p class="small text-muted mb-0">Planning a new event? <a href="register.html" class="fw-bold" style="color: var(--sunflower-yellow);">Register Account</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
